services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: workspace_test
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d workspace_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    profiles: ["smoke"]
    build:
      context: .
      target: runtime
    init: true
    environment:
      DATABASE_URL: postgresql://qa:disposable-test-only@db:5432/workspace_test
      ADMIN_SECRET: disposable-test-only-admin-secret-32chars
      PUBLIC_ORIGIN: http://localhost:8787
      STORAGE_DIR: /data/files
    volumes:
      - qa-files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
  test:
    build:
      context: .
      target: qa
    environment:
      TEST_DATABASE_URL: postgresql://qa:disposable-test-only@db:5432/workspace_test
      REQUIRE_POSTGRES_TEST: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "test"]
volumes:
  qa-files:
